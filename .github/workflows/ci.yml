name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 编译检查
        run: python -m compileall -q server tools tests

      - name: 静态站点存在
        run: test -f web/site/index.html

      - name: 全部测试
        run: python tools/run_tests.py

  docker:
    name: 镜像可构建
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gomoku-match:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
